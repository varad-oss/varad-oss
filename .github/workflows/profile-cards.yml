name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
              USERNAME: varad-oss
              BRANCH_NAME: "main"
              UTC_OFFSET: 5.5
              EXCLUDE: ""
              AUTO_PUSH: true
              THEME: dracula
